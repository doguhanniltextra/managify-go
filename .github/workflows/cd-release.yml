name: CD - Release & Image Publish

permissions:
  contents: write
  packages: write

on:
  push:
    branches:
      - master
    paths:
      - 'managify-backend/**'
      - '.github/workflows/cd-release.yml'
      - '!VERSION.md'

concurrency:
  group: cd-release-master
  cancel-in-progress: false

jobs:
  quality-gate:
    name: Test & Lint Gate
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: ./.github/actions/setup-go-cache

      - name: Test
        working-directory: managify-backend
        run: go test -race -count=1 -timeout=3m ./...

  bump-and-release:
    name: Bump Version & Create Release
    needs: quality-gate
    if: "github.actor != 'github-actions[bot]'"
    runs-on: self-hosted
    timeout-minutes: 10

    outputs:
      new_version: ${{ steps.bump_version.outputs.new_version }}
      tag_name: ${{ steps.tag.outputs.tag_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Read current version
        id: current_version
        run: |
          VERSION=$(grep -oE 'v?[0-9]+(\.[0-9]+){0,2}' VERSION.md | head -1 | tr -d 'v' || true)
          VERSION="${VERSION#.}"
          if [ -z "${VERSION}" ]; then
            VERSION="0.0.0"
          else
            PARTS=$(echo "${VERSION}" | awk -F. '{print NF}')
            if [ "${PARTS}" -eq 1 ]; then
              VERSION="${VERSION}.0.0"
            elif [ "${PARTS}" -eq 2 ]; then
              VERSION="${VERSION}.0"
            fi
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Current version: ${VERSION}"

      - name: Bump patch version
        id: bump_version
        run: |
          CURRENT="${{ steps.current_version.outputs.version }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "Bumped version: v${CURRENT} -> v${NEW_VERSION}"

      - name: Update VERSION.md
        run: |
          NEW_VERSION="${{ steps.bump_version.outputs.new_version }}"
          printf "# Version\n\nv${NEW_VERSION}\n" > VERSION.md

      - name: Commit and push version bump
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add VERSION.md
          git commit -m "chore(release): bump version to v${{ steps.bump_version.outputs.new_version }} [skip ci]" || echo "No changes to commit"
          git push
          # Pull the latest commit so the tag points to the version bump commit
          git pull --rebase

      - name: Create and push tag
        id: tag
        run: |
          TAG="v${{ steps.bump_version.outputs.new_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: ${{ steps.tag.outputs.tag_name }}
          generate_release_notes: true
          draft: false
          prerelease: false

  docker-publish:
    name: Build & Push Docker Image
    needs: bump-and-release
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & Publish Image
        uses: ./.github/actions/docker-build-scan-push
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/managify-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/managify-backend:v${{ needs.bump-and-release.outputs.new_version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/managify-backend:${{ github.sha }}
