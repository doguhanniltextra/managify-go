name: CI - Test & Lint

on:
  push:
    branches: [master]
    paths:
      - 'managify-backend/**'
      - '.github/workflows/ci-test.yml'
  pull_request:
    branches: [master]
    paths:
      - 'managify-backend/**'
      - '.github/workflows/ci-test.yml'

jobs:
  test:
    name: Build, Test & Vet
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: managify-backend/go.mod

      - name: Download dependencies
        working-directory: managify-backend
        run: go mod download

      - name: Build
        working-directory: managify-backend
        run: go build ./...

      - name: Test
        working-directory: managify-backend
        run: go test -race -count=1 ./...

      - name: Vet
        working-directory: managify-backend
        run: go vet ./...
