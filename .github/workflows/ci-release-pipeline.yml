name: CI - Version Bump, Release & Publish

permissions:
  contents: write
  packages: write

on:
  push:
    branches:
      - master
    paths:
      - 'managify-backend/**'
      - '.github/workflows/**'
      - '!VERSION.md'

jobs:
  # Gate: only proceed if tests pass
  test:
    name: Test & Lint
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: managify-backend/go.mod

      - name: Build
        working-directory: managify-backend
        run: go build ./...

      - name: Test
        working-directory: managify-backend
        run: go test -race -count=1 ./...

      - name: Vet
        working-directory: managify-backend
        run: go vet ./...

  bump-and-release:
    name: Bump Version & Create Release
    needs: test
    if: "github.actor != 'github-actions[bot]'"
    runs-on: self-hosted

    outputs:
      new_version: ${{ steps.bump_version.outputs.new_version }}
      tag_name: ${{ steps.tag.outputs.tag_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Read current version
        id: current_version
        run: |
          VERSION=$(grep -oE 'v?[0-9]+(\.[0-9]+){0,2}' VERSION.md | head -1 | tr -d 'v' || true)
          VERSION="${VERSION#.}"
          if [ -z "${VERSION}" ]; then
            VERSION="0.0.0"
          else
            PARTS=$(echo "${VERSION}" | awk -F. '{print NF}')
            if [ "${PARTS}" -eq 1 ]; then
              VERSION="${VERSION}.0.0"
            elif [ "${PARTS}" -eq 2 ]; then
              VERSION="${VERSION}.0"
            fi
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Current version: ${VERSION}"

      - name: Bump patch version
        id: bump_version
        run: |
          CURRENT=${{ steps.current_version.outputs.version }}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "Bumped version: v${CURRENT} -> v${NEW_VERSION}"

      - name: Update VERSION.md
        run: |
          NEW_VERSION=${{ steps.bump_version.outputs.new_version }}
          printf "# Version\n\nv${NEW_VERSION}\n" > VERSION.md

      - name: Commit and push version bump
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add VERSION.md
          git commit -m "chore(release): bump version to v${{ steps.bump_version.outputs.new_version }} [skip ci]" || echo "No changes to commit"
          git push

      - name: Create and push tag
        id: tag
        run: |
          TAG="v${{ steps.bump_version.outputs.new_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: ${{ steps.tag.outputs.tag_name }}
          body: |
            ## Release ${{ steps.tag.outputs.tag_name }}

            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.ref_name }}
          draft: false
          prerelease: false

  docker-publish:
    name: Build & Push Docker Image
    needs: bump-and-release
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./managify-backend
          file: ./managify-backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/managify-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/managify-backend:v${{ needs.bump-and-release.outputs.new_version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/managify-backend:${{ github.sha }}
          platforms: linux/amd64

  deploy-render:
    name: Deploy to Render.com
    needs: docker-publish
    runs-on: self-hosted
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "::warning ::RENDER_DEPLOY_HOOK_URL secret is not configured. Skipping Render deployment."
            exit 0
          fi
          echo "Triggering deployment on Render.com..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Successfully triggered Render deployment! (HTTP $HTTP_STATUS)"
          else
            echo "::error ::Failed to trigger Render deployment! HTTP status: $HTTP_STATUS"
            exit 1
          fi

