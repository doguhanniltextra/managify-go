version: 2
updates:
  # Go backend dependencies
  - package-ecosystem: "gomod"
    directory: "/managify-backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "backend"

  # GitHub Actions workflows & actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "ci-cd"

  # Dockerfile updates
  - package-ecosystem: "docker"
    directory: "/managify-backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
